services:
  - type: web
    name: abanoub-followup-api
    runtime: docker
    dockerfilePath: ./dotnet-api/FollowUp.Api/Dockerfile
    dockerContext: ./dotnet-api/FollowUp.Api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: STAFF_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
